- name: Login to ACR
  # tags: [auth]
  ansible.builtin.shell: |
    docker login \
      -u "{{ acr_user }}" \
      --password-stdin \
      {{ registry }}
  args: 
    stdin: "{{ acr_password }}"
  no_log: true

- name: Get latest tag from ACR
  ansible.builtin.shell: |
          set -eu

          AUTH_HEADER=$(curl -sI "https://{{ registry }}/v2/" | grep -i "www-authenticate")
          REALM=$(echo "$AUTH_HEADER" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          SERVICE=$(echo "$AUTH_HEADER" | sed -n 's/.*service="\([^"]*\)".*/\1/p')

          SCOPE="repository:{{ acr_namespace }}/{{ acr_image }}:pull"
          TOKEN=$(curl -sS -u "{{ acr_user }}:{{ acr_password }}" \
            "${REALM}?service=${SERVICE}&scope=${SCOPE}" | jq -r '.token // .access_token')

          TAGS_JSON=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://{{ registry }}/v2/{{ acr_namespace }}/{{ acr_image }}/tags/list")

          acr_image_tag=$(echo "$TAGS_JSON" | jq -r '.tags | sort_by(. | split("_")[0] | tonumber) | last')

          if [ -z "$acr_image_tag" ] || [ "$acr_image_tag" = "null" ]; then
            echo "failed to get image tag"
            exit 1
          fi

          echo "$acr_image_tag"
  register: acr_result
  when: acr_image_tag is none or acr_image_tag == ""

- name: Set acr_image_tag fact
  ansible.builtin.set_fact:
    acr_image_tag: "{{ acr_result.stdout }}"
  when: acr_image_tag is none or acr_image_tag == ""
