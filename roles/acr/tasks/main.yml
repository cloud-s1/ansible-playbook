- name: Login to ACR
  # tags: [auth]
  shell: |
    echo "{{ acr_password }}" | docker login \
      -u 个人云数据 \
      --password-stdin \
      {{ registry }}

- name: Get latest tag from ACR
  shell: |
          set -eu

          AUTH_HEADER=$(curl -sI "https://{{ registry }}/v2/" | grep -i "www-authenticate")
          REALM=$(echo "$AUTH_HEADER" | grep -oP 'realm="\K[^"]+')
          SERVICE=$(echo "$AUTH_HEADER" | grep -oP 'service="\K[^"]+')

          SCOPE="repository:{{ acr_namespace }}/{{ repo_image }}:pull"
          TOKEN=$(curl -sS -u "个人云数据:{{ acr_password }}" \
            "${REALM}?service=${SERVICE}&scope=${SCOPE}" | jq -r '.token // .access_token')

          TAGS_JSON=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://{{ registry }}/v2/{{ acr_namespace }}/{{ repo_image }}/tags/list")

          image_tag=$(echo "$TAGS_JSON" | jq -r '.tags | sort_by(. | split("_")[0] | tonumber) | last')

          if [ -z "$image_tag" ] || [ "$image_tag" = "null" ]; then
            echo "failed to get image tag"
            exit 1
          fi

          echo "$image_tag"
  register: acr_result
  when: image_tag is none or image_tag == ""

- name: Set image_tag fact
  set_fact:
    image_tag: "{{ acr_result.stdout }}"
  when: image_tag is none or image_tag == ""